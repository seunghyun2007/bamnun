body{margin:0}button{font:inherit;color:inherit;cursor:pointer}
.olw{position:relative;aspect-ratio:600/640}
.ol-shadow{position:absolute;left:24%;right:24%;bottom:2%;height:5%;border-radius:50%;background:rgba(0,0,0,.4);filter:blur(2px)}
.ol-clip{position:absolute;inset:0}
.ol-clip.peek{inset:0 0 3% 0;overflow:hidden}
.ol-enter{position:absolute;inset:0;transform-origin:50% 96%;animation:olIn .8s cubic-bezier(.22,1,.36,1) both}
.ol-clip.peek .ol-enter{animation:olPeekIn 1.1s cubic-bezier(.34,1.45,.55,1) both}
.ol-loop{position:absolute;inset:0;transform-origin:50% 96%}
.ol-loop img{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 .4em .8em rgba(0,0,0,.35))}
.ol-eye{position:absolute;width:18.6%;height:17.44%;border-radius:50%;overflow:hidden}
.ol-lid{position:absolute;left:-4%;right:-4%;top:-4%;height:108%;background:#714330;border-bottom:.22em solid #1b1320;border-radius:0 0 45% 45%/0 0 22% 22%;transform:translateY(-112%);animation:olBlink 5s cubic-bezier(.4,0,.2,1) infinite}
.a-breathe{animation:olBreathe 3.4s ease-in-out infinite}
.a-wave{animation:olWave 1.4s ease-in-out infinite}
.a-think{animation:olThink 3.8s ease-in-out infinite}
.a-sleep{animation:olSleep 4.4s ease-in-out infinite}
.a-shock{animation:olShock .6s ease-out both,olTremble 2.2s .6s ease-in-out infinite}
.a-jump{animation:olJump 1.1s cubic-bezier(.45,0,.55,1) infinite}
.a-peek{animation:olPeekBob 2.8s 1.1s ease-in-out infinite}
.a-drive{animation:olDrive 3.2s ease-in-out infinite}
.s-jump{animation:olShadow 1.1s cubic-bezier(.45,0,.55,1) infinite}
.ol-fx{position:absolute;pointer-events:none;line-height:1;font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:800;color:#F4EFE6}
.fx-q{animation:olQ 2.4s ease-in-out infinite}
.fx-z{opacity:0;animation:olZ 3.3s ease-out infinite}
.fx-bang{color:#C4B5FD;animation:olBang .55s .15s cubic-bezier(.3,1.8,.5,1) both,olBangP 1.6s .8s ease-in-out infinite}
.fx-ray{position:absolute;left:50%;top:30%;width:.28em;height:1em;margin-left:-.14em;border-radius:.2em;background:#F4EFE6;opacity:0;animation:olRay 1.3s ease-out infinite}
.fx-cf{position:absolute;top:-6%;width:.38em;height:.6em;border-radius:.12em;opacity:0;animation:olCf 2s linear infinite}
.fx-star{position:absolute;width:1.3em;height:1.3em;animation:olTw 1.4s ease-in-out infinite}
.fx-wl{position:absolute;width:1em;height:1em;border-right:.2em solid #F4EFE6;border-radius:50%;opacity:0;animation:olWl 1.4s ease-in-out infinite}
.fx-ledge{left:2%;right:2%;bottom:2.4%;height:.3em;border-radius:.3em;background:#F4EFE6;opacity:.9}
.fx-cup{position:absolute;right:-4%;bottom:2%;width:15%}
.fx-steam{opacity:0;animation:olSteam 2.6s ease-out infinite}

class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cur: 1, flip: false, manual: false }; }
  componentDidMount() {
    this.timer = setInterval(() => {
      if (this.state.manual) return;
      this.setState({ cur: (this.state.cur + 1) % 8, flip: !this.state.flip });

  }

    const eye = (l, t) => ({ style: 'left:' + l + '%;top:' + t + '%' });

      { id: 'idle', name: 'Idle', use: 'Home screen, ready to drive', src: '/_blob/bb73e1b39dabf3b35d036c39c5cdd1c1', anim: 'a-breathe', eyes: [eye(27.08, 32.58), eye(54.2, 32.6)] },

      { id: 'thinking', name: 'Thinking', use: 'Loading, calibrating, questions', src: '/_blob/4af7029f76e815daac75989af4aba986', anim: 'a-think', eyes: [eye(26.76, 35.45), eye(50.56, 31.49)], q: true },

      { id: 'wake', name: 'Wake up!', use: 'Alarm step and microsleeps', src: '/_blob/57efe0ac85b17a5178828ea07e413fad', anim: 'a-shock', eyes: [], bang: true },
      { id: 'celebrate', name: 'Celebrate', use: 'Setup done, safe trip finished', src: '/_blob/f6f6ffbf7935cbf40e40727534b41f50', anim: 'a-jump', eyes: [], cf: true, jump: true },
      { id: 'peek', name: 'Peek', use: 'Meet Ollie, tips and reminders', src: '/_blob/5e3b2ef0811cd96b7ab97688744ccbd7', anim: 'a-peek', eyes: [eye(27.86, 66.63), eye(53.23, 66.47)], ledge: true, peek: true },
      { id: 'driving', name: 'Driving', use: 'Live trip in progress', src: '/_blob/e5ad4d3fd744c75caea7c6c78782a441', anim: 'a-drive', eyes: [eye(27.65, 38.91), eye(53.35, 38.71)], cup: true }
    ];

    const rays = angles.map((a, i) => ({ style: '--a:' + a + 'deg;animation-delay:' + (0.6 + i * 0.05).toFixed(2) + 's' }));
    const cols = ['#C4B5FD', '#F8C4A4', '#A99BF0', '#F48FB1', '#F5B5C8', '#F5E6C8'];

    const stars = [{ style: 'left:4%;top:8%' }, { style: 'left:86%;top:0%;animation-delay:.4s' }, { style: 'left:90%;top:40%;animation-delay:.8s;width:1em;height:1em' }];
    const build = (s, w) => ({
      name: s.name, use: s.use, src: s.src, alt: 'Ollie the owl, ' + s.name,
      wrap: 'width:' + w + 'px;font-size:' + (w / 10) + 'px;flex-shrink:0',
      anim: s.anim, eyes: s.eyes, clipCls: s.peek ? 'ol-clip peek' : 'ol-clip',
      shadow: !s.peek, shadowCls: s.jump ? 'ol-shadow s-jump' : 'ol-shadow',
      q: !!s.q, z: !!s.z, bang: !!s.bang, cf: !!s.cf, wl: !!s.wl, ledge: !!s.ledge, cup: !!s.cup,
      rays, conf, stars
    });
    const st = this.state;
    const cur = S[st.cur];
    const chips = S.map((s, i) => ({
      name: s.name, on: String(i === st.cur),
      style: 'padding:10px 16px;border-radius:99px;font-weight:700;font-size:14px;border:2px solid ' + (i === st.cur ? '#C4B5FD' : 'transparent') + ';background:' + (i === st.cur ? '#C4B5FD' : 'rgba(255,255,255,.07)') + ';color:' + (i === st.cur ? '#241A26' : '#F4EFE6'),
      pick: () => this.setState({ cur: i, flip: !st.flip, manual: true })
    }));
    return {
      stage: [build(cur, 300)], showA: !st.flip, showB: st.flip,
      curName: cur.name, curUse: 'Used for: ' + cur.use, chips,
      grid: S.map((s) => build(s, 96))
    };
  }
}
</script>
</body>
</html>
