<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Pretendard:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}a{color:#9A93A0}a:hover{color:#F2EEE8}button{font:inherit;color:inherit;cursor:pointer}
.olw{position:relative;aspect-ratio:600/640}
.ol-shadow{position:absolute;left:24%;right:24%;bottom:2%;height:5%;border-radius:50%;background:rgba(0,0,0,.45);filter:blur(2px)}
.ol-clip{position:absolute;inset:0}
.ol-enter{position:absolute;inset:0;transform-origin:50% 96%;animation:olIn .8s cubic-bezier(.22,1,.36,1) both}
.ol-loop{position:absolute;inset:0;transform-origin:50% 96%}
.ol-loop img{position:absolute;inset:0;width:100%;height:100%;display:block}
.ol-eye{position:absolute;width:18.6%;height:17.44%;border-radius:50%;overflow:hidden}
.ol-lid{position:absolute;left:-4%;right:-4%;top:-4%;height:108%;background:#714330;border-bottom:.22em solid #1b1320;border-radius:0 0 45% 45%/0 0 22% 22%;transform:translateY(-112%);animation:olBlink 5s cubic-bezier(.4,0,.2,1) infinite}
.a-breathe{animation:olBreathe 3.4s ease-in-out infinite}
@keyframes olIn{0%{opacity:0;transform:translateY(14%) scale(.5,.42)}38%{opacity:1;transform:translateY(-5%) scale(1.07,.95)}58%{transform:translateY(0) scale(.95,1.05)}78%{transform:scale(1.02,.98)}100%{opacity:1;transform:none}}
@keyframes olBlink{0%,90%,100%{transform:translateY(-112%)}93%,94.5%{transform:translateY(0)}}
@keyframes olBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(.985,1.03)}}
</style>
</helmet>
<div style="width:390px;height:1520px;box-sizing:border-box;position:relative;overflow:hidden;background:#15131A;color:#F2EEE8;font-family:Pretendard,system-ui,sans-serif">
  <header id="hHead" style="position:relative;padding:58px 22px 0;box-sizing:border-box">
    <div style="position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:12px">
      <div style="min-width:0">
        <h1 style="margin:0;font-family:Pretendard,system-ui,sans-serif;font-weight:700;font-size:28px;line-height:1.2;letter-spacing:-.01em" id="hHello">Good evening,<br>{name}</h1>
        <div style="display:flex;gap:8px;margin-top:8px;align-items:center;font-size:13px;color:#9A93A0;font-weight:500">
          <span id="hShift">Night shift</span><span aria-hidden="true">·</span>
          <span style="display:inline-flex;align-items:center;gap:6px"><span data-live="conn-dot" style="width:7px;height:7px;border-radius:50%;background:#E8D7AE"></span><span data-live="conn">Bamnun 3F2A connected</span></span>
        </div>
      </div>
      <a href="Settings.dc.html" aria-label="Settings" style="width:40px;height:40px;flex-shrink:0;border:0;border-radius:50%;background:#1F1C24;display:grid;place-items:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#F2EEE8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"></path></svg></a>
    </div>
  </header>

  <div style="position:relative;margin-top:24px;padding:0 16px;display:flex;flex-direction:column;gap:12px">
    <section id="hDrive" hidden style="border-radius:20px;overflow:hidden;cursor:pointer;background:#1F1C24"></section>
    <section style="background:#1F1C24;border-radius:20px;padding:22px 20px 20px;position:relative">
      <div class="olw" style="position:absolute;right:16px;top:18px;width:64px;font-size:6.4px" aria-hidden="true">
        <div class="ol-clip"><div class="ol-enter"><div class="ol-loop a-breathe">
          <img data-live="owl" src="/_blob/bb73e1b39dabf3b35d036c39c5cdd1c1" alt="">
          <div class="ol-eye" data-live="owl-eye" style="left:27.08%;top:32.58%"><div class="ol-lid"></div></div>
          <div class="ol-eye" data-live="owl-eye" style="left:54.2%;top:32.6%"><div class="ol-lid"></div></div>
        </div></div></div>
      </div>
      <span style="display:block;font-size:13px;color:#9A93A0;font-weight:500">Right now</span>
      <div data-live="status" style="font-family:Pretendard,system-ui,sans-serif;font-weight:700;font-size:44px;line-height:1.1;letter-spacing:-.02em;margin-top:8px;color:#E8D7AE;padding-right:70px">Ready</div>
      <p data-live="status-note" style="margin:8px 0 0;color:#9A93A0;font-size:14.5px;line-height:1.45">Hardest stretch tonight is <b style="color:#F2EEE8">3 to 5 AM</b>. Start a trip and Ollie starts watching.</p>
      <div style="margin-top:22px">
        <div style="display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:#9A93A0"><span>Sleepiness</span><span><b data-live="kss" style="color:#F2EEE8;font-size:15px">2</b> / 9</span></div>
        <div style="height:8px;margin-top:8px;border-radius:4px;background:#2E2A33;overflow:hidden"><div data-live="kss-bar" style="width:0%;height:100%;border-radius:4px;background:#E8D7AE;transition:width .6s ease"></div></div>
      </div>
    </section>

    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <section style="background:#1F1C24;border-radius:20px;padding:16px 18px"><span style="display:block;font-size:13px;color:#9A93A0;font-weight:500">Blinks / min</span><b data-live="blinks" style="display:block;margin-top:6px;font-size:26px;font-weight:700;letter-spacing:-.01em">–</b></section>
      <section style="background:#1F1C24;border-radius:20px;padding:16px 18px"><span style="display:block;font-size:13px;color:#9A93A0;font-weight:500">Next rest</span><b data-live="next-rest" style="display:block;margin-top:6px;font-size:26px;font-weight:700;letter-spacing:-.01em">–</b></section>
    </div>

    <div style="display:flex;justify-content:space-between;align-items:baseline;margin:14px 4px 0"><h2 style="margin:0;font-family:Pretendard,system-ui,sans-serif;font-size:18px;font-weight:700">Last trip</h2><a href="Trips.dc.html" style="font-weight:500;font-size:14px;text-decoration:none">All trips</a></div>
    <section id="hTrip" style="background:#1F1C24;border-radius:20px;overflow:hidden"></section>

    <section style="background:#1F1C24;border-radius:20px;overflow:hidden;margin-top:12px">
      <a href="Camera.dc.html" style="display:flex;align-items:center;justify-content:space-between;padding:16px 18px;color:#F2EEE8;text-decoration:none;font-size:15px;font-weight:600"><span>Live camera</span><span style="color:#9A93A0;display:grid"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span></a>
      <div style="height:1px;background:#2E2A33;margin:0 18px"></div>
      <a href="Stages.dc.html" style="display:flex;align-items:center;justify-content:space-between;padding:16px 18px;color:#F2EEE8;text-decoration:none;font-size:15px;font-weight:600"><span>Try the wake-up stages</span><span style="color:#9A93A0;display:grid"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></span></a>
    </section>
  </div>

  <nav style="position:absolute;left:16px;right:16px;bottom:26px;display:flex;align-items:center;justify-content:space-between">
    <div style="display:flex;gap:2px;padding:5px;border-radius:22px;background:#1F1C24;box-shadow:0 8px 24px rgba(0,0,0,.45)">
      <a href="Home.dc.html" aria-current="page" style="width:66px;height:50px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:11px;font-weight:600;background:#2E2A33;color:#F2EEE8"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
      <a href="Trips.dc.html" style="width:66px;height:50px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:11px;font-weight:600;color:#9A93A0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="18" r="2.5"></circle><circle cx="18" cy="6" r="2.5"></circle><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5"></path></svg>Trips</a>
      <a href="Insights.dc.html" style="width:66px;height:50px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;text-decoration:none;font-size:11px;font-weight:600;color:#9A93A0"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 20V12M12 20V5M19 20v-8"></path></svg>Insights</a>
    </div>
    <a href="Route.dc.html" aria-label="Start trip" style="width:60px;height:60px;border-radius:50%;background:#E8D7AE;color:#15131A;display:grid;place-items:center;box-shadow:0 8px 24px rgba(0,0,0,.45)"><svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13a1 1 0 0 0 1.5.9l10.2-6.5a1 1 0 0 0 0-1.7L9.5 4.6A1 1 0 0 0 8 5.5z"></path></svg></a>
  </nav>
</div>
