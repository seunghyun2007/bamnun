<style>body{margin:0}a{color:#F2EEE8}a:hover{color:#E8D7AE}button{font:inherit;color:inherit;cursor:pointer}
.pr-stage{position:relative}
.pr-dev{transition:opacity .5s,transform .6s cubic-bezier(.3,1.5,.5,1)}
.pr-ring,.pr-sweep,.pr-bt{display:none}
.searching .pr-dev{opacity:0;transform:scale(.55)}
.searching .pr-ring{display:block;position:absolute;width:70px;height:70px;border-radius:50%;border:2px solid #E8D7AE;animation:prPulse 2.4s cubic-bezier(.2,.6,.4,1) infinite}
.searching .pr-sweep{display:block;position:absolute;width:210px;height:210px;border-radius:50%;background:transparent;animation:prSpin 1.8s linear infinite;-webkit-mask:radial-gradient(circle,#000 0 69%,transparent 70%);mask:radial-gradient(circle,#000 0 69%,transparent 70%)}
.searching .pr-bt{display:grid;place-items:center;position:absolute;width:64px;height:64px;border-radius:50%;background:#E8D7AE;box-shadow:0 0 30px rgba(232,215,174,.6);animation:prBeat 1.2s ease-in-out infinite}
.searching .pr-static{opacity:0}
.pr-static{transition:opacity .5s}
#pCard,#pChecks>div{transition:opacity .45s,transform .45s cubic-bezier(.22,1,.36,1)}
.searching #pCard,.searching #pChecks>div{opacity:0;transform:translateY(12px)}
#pNext{transition:opacity .3s}
.searching #pNext{opacity:.35;pointer-events:none}
.pr-txt{transition:opacity .25s}
@keyframes prPulse{0%{transform:scale(.9);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes prSpin{to{transform:rotate(360deg)}}
@keyframes prBeat{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
</style>
</helmet>
