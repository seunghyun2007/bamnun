<style>
body{margin:0}a{color:#F2EEE8}a:hover{color:#E8D7AE}input::placeholder{color:#9A93A0}
.olw{position:relative;aspect-ratio:600/640}

.ol-loop{position:absolute;inset:0;transform-origin:50% 96%}

.ol-fx{position:absolute;pointer-events:none;line-height:1;font-family:Pretendard,system-ui,sans-serif;font-weight:700;color:#F2EEE8}
.fx-q{animation:olQ 2.4s ease-in-out infinite}
@keyframes olIn{0%{opacity:0;transform:translateY(14%) scale(.5,.42)}38%{opacity:1;transform:translateY(-5%) scale(1.07,.95)}58%{transform:translateY(0) scale(.95,1.05)}78%{transform:scale(1.02,.98)}100%{opacity:1;transform:none}}

@keyframes olThink{0%,100%{transform:rotate(0) scale(1,1)}40%{transform:rotate(-3.5deg) scale(.99,1.015)}70%{transform:rotate(-2deg) scale(1,1)}}
