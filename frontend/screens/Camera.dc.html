<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live camera</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}a{color:#F4EFE6}a:hover{color:#C4B5FD}
.cm-scan{animation:cmScan 2.4s linear infinite}
.cm-dot{animation:cmDot 1.2s ease-in-out infinite}
@keyframes cmScan{from{transform:translateY(-60px)}to{transform:translateY(420px)}}
@keyframes cmDot{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:radial-gradient(100% 50% at 100% 0%,rgba(168,132,232,0.38) 0%,rgba(168,132,232,0) 62%),radial-gradient(90% 55% at 0% 45%,rgba(236,140,172,0.23) 0%,rgba(236,140,172,0) 60%),radial-gradient(110% 55% at 70% 105%,rgba(244,164,128,0.24) 0%,rgba(244,164,128,0) 65%),#17111A;color:#F4EFE6;font-family:Figtree,Arial,sans-serif;display:flex;flex-direction:column;padding:56px 16px 0">
  <div style="display:flex;align-items:center;gap:14px;height:44px;margin-bottom:12px;padding:0 6px">
    <a href="Home.dc.html" aria-label="Back to home" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);display:grid;place-items:center;color:#F4EFE6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>

  </div>
  <div style="position:relative;height:420px;border-radius:24px;overflow:hidden;background:radial-gradient(circle at 50% 38%,#3d4a42 0%,#1e2620 72%)">
    <svg width="358" height="420" viewBox="0 0 358 420" role="img" aria-label="Infrared camera view of the driver with eye tracking">
      <ellipse cx="179" cy="190" rx="92" ry="116" fill="#56645a"></ellipse>
      <path d="M87 176 C 84 80, 274 80, 271 176 C 266 132, 232 102, 179 102 C 126 102, 92 132, 87 176Z" fill="#2c352f"></path>

      <ellipse cx="143" cy="186" rx="18" ry="8" fill="#1b211d"></ellipse><ellipse cx="215" cy="186" rx="18" ry="8" fill="#1b211d"></ellipse>
      <circle cx="146" cy="184" r="2.6" fill="#fff" opacity=".9"></circle><circle cx="218" cy="184" r="2.6" fill="#fff" opacity=".9"></circle>
      <path d="M166 236 q13 7 26 0" stroke="#2c352f" stroke-width="4" fill="none" stroke-linecap="round"></path>

    <span style="position:absolute;top:14px;left:14px;padding:6px 12px;border-radius:99px;background:#F8C4A4;color:#241A26;font-size:13px;font-weight:700">Eyes open</span>
    <span style="position:absolute;top:14px;right:14px;padding:6px 10px;border-radius:99px;background:rgba(23,17,26,.6);font-size:12px;font-weight:600;color:#B3A6B4">Infrared · 30 fps</span>

  </div>
  <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px">
    <div style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:16px;padding:12px 10px;text-align:center"><b style="display:block;font-family:'Bricolage Grotesque',Arial,sans-serif;font-stretch:80%;font-size:24px;font-weight:800">1.9%</b><span style="font-size:12px;color:#B3A6B4">Eyes closed, last min</span></div>
    <div style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:16px;padding:12px 10px;text-align:center"><b style="display:block;font-family:'Bricolage Grotesque',Arial,sans-serif;font-stretch:80%;font-size:24px;font-weight:800">15</b><span style="font-size:12px;color:#B3A6B4">Blinks / min</span></div>
    <div style="background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:16px;padding:12px 10px;text-align:center"><b style="display:block;font-family:'Bricolage Grotesque',Arial,sans-serif;font-stretch:80%;font-size:24px;font-weight:800">0.18 s</b><span style="font-size:12px;color:#B3A6B4">Last blink</span></div>
  </div>
  <div style="display:flex;align-items:center;gap:12px;margin-top:8px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A99BF0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 3v4M12 17v4M3 12h4M17 12h4"></path></svg>
    <span style="flex-grow:1;font-size:14px;line-height:1.35"><b style="display:block">Looking at the road</b><span style="color:#B3A6B4">Head 2° left · inside the safe zone</span></span>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;padding:16px 22px 36px;display:flex;justify-content:center">
    <a href="Calibrate.dc.html" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:15px 26px;box-sizing:border-box;border-radius:999px;background:rgba(255,255,255,.11);color:#F4EFE6;font-weight:700;font-size:15px;text-decoration:none">Recalibrate my eyes</a>
  </div>
</div>
