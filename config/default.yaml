# bamnun driver-state monitor: default configuration
# Every tunable lives here so the poster can report exact parameter values.

capture:
  # source: picamera | webcam | video
  source: webcam
  device: 0                  # webcam index, or path for source=video
  width: 1280
  height: 720
  fps: 30
  flip_horizontal: false
  grayscale_input: false     # NoIR feed is effectively monochrome; set true on Pi

  picamera:
    # IMX708 sensor modes (Pi 5 / picamera2):
    #   1536x864   @ up to 120 fps   (2x2 binned)  <- use this for eye tracking
    #   2304x1296  @ up to 56  fps
    #   4608x2592  @ up to 14  fps
    sensor_mode_size: [1536, 864]
    # Lock everything. Auto-exposure hunting under IR illumination destroys
    # frame-to-frame EAR stability, and autofocus hunting is worse.
    lock_exposure: true
    exposure_time_us: 8000     # 8 ms -> caps motion blur, needs decent IR power
    analogue_gain: 4.0
    lock_awb: true
    colour_gains: [1.0, 1.0]   # neutral; IR scene has no meaningful white balance
    manual_focus: true
    lens_position: 4.5         # dioptres ~= 1/distance(m); 4.5 -> ~22 cm. TUNE.
    noise_reduction: fast
    # The camera is mounted upside down: turn the picture the right way up.
    rotate_180: true

  # 3 W IR LED with its own constant-current driver, switched by a MOSFET
  # board on GPIO25. On only while a listed source is running; a webcam or a
  # replayed file needs no IR. Without gpiozero it is a logging stub.
  illuminator:
    enabled: true
    gpio_pin: 25
    sources: [picamera]

landmarks:
  # Path is resolved relative to the repo root if not absolute.
  model_path: models/face_landmarker.task
  num_faces: 1
  min_face_detection_confidence: 0.4   # lowered: IR faces score lower than RGB
  min_face_presence_confidence: 0.4
  min_tracking_confidence: 0.4
  # eyeBlink, eyeSquint, jawOpen, mouthSmile, cheekSquint: a second opinion on
  # the eyes, and smiles/yawns/talking (docs/SPEC.md, 15). Costs ~2 ms a frame.
  output_blendshapes: true
  # Give MediaPipe a picture this wide (0 = the full frame); landmarks still map
  # onto the full frame. Measured on the laptop at 640: SLOWER (39.5 vs 17.2 ms
  # a frame) and EAR shifted 2.7 %, so it stays off. Measure on the Pi before
  # turning it on there.
  input_width: 0

features:
  # Eye measures are on the DRIVER'S OWN openness scale (docs/SPEC.md, 15):
  # 100 % = their normal open eyes (the median of the calibration look-ahead),
  # 0 % = their closed eyes (the eyes-closed step). Small eyes, big eyes and
  # glasses then behave the same. Sources and reasoning: docs/thresholds.md.
  eyes:
    # -- openness from the camera ------------------------------------------- #
    eye_drop_width_ratio: 0.60     # an eye narrower than this x the other (turned away, covered) is ignored
    pose_compensation_max_deg: 30  # EAR is corrected for yaw/pitch foreshortening up to this
    blendshape_weight: 0.5         # share of MediaPipe eyeBlink in the fused openness (0 = EAR only)
    eye_disagreement: 0.45         # EAR and eyeBlink openness further apart = glare/landmark error: frame unreliable
    # -- frames that can't be trusted for eye measures ----------------------- #
    smile_threshold: 0.35          # mouthSmile above this = smiling (cheeks narrow the eyes)
    cheek_threshold: 0.30          # cheekSquint above this = smiling or laughing
    smile_mouth_width_ratio: 1.12  # no blendshapes: mouth this much wider than at rest = smiling
    talk_jaw_std: 0.05             # jawOpen moving this much within talk_window_s = talking
    talk_window_s: 1.0
    yawn_jaw_open: 0.50            # jawOpen held above this ...
    yawn_mar: 0.55                 # ... (or mouth aspect ratio this far above rest, without blendshapes)
    yawn_min_s: 1.0                # ... for this long = a yawn (yawns last ~6 s, Provine 1986)
    expression_hold_s: 0.7         # frames stay unreliable this long after an expression ends
    light_jump: 18.0               # face brightness jumping this far (0-255) from its 2 s average = lighting change
    light_hold_s: 1.0              # ... frames unreliable for this long after
    min_iod_frac: 0.045            # face smaller than this (eye distance / frame width): too far for eyelids
    reliable_yaw_deg: 30.0         # head turned further than this from neutral: eye shape unreliable
    reliable_camera_yaw_deg: 55.0  # ... or further than this from the camera itself: the eyes can't
                                   # be seen (the device sits 40 deg to the driver's left), so no
                                   # closure, microsleep or PERCLOS is counted from those frames
    reliable_pitch_deg: 30.0
    # -- blinks ---------------------------------------------------------------- #
    blink_half_level: 0.50         # blinks are timed where openness crosses 50 % (half amplitude)
    blink_open_level: 0.70         # a new blink needs the eyes back above this first
    long_blink_s: 0.30             # half-amplitude duration from which a blink is "long" (drowsy sign)
    held_closure_s: 1.0            # longer "blinks" are held closures/squints: not in blink stats
    blink_window_s: 60.0
    min_blinks_for_stats: 5        # fewer judged blinks in the window = no blink averages yet
    # -- shut eyes and the microsleep bypass ----------------------------------- #
    perclos_closed_level: 0.20     # P80: openness <= 20 % counts as closed for PERCLOS
    shut_level: 0.25               # fused openness at or below this = shut
    shut_each_level: 0.40          # ... and, with blendshapes, EAR and eyeBlink each at or below this
    eyes_closed_label_s: 0.30      # shut this long shows "Eyes closed"; a normal blink never does
    microsleep_s: 0.50             # shut this long = microsleep: straight to the top stage
    microsleep_looking_down_s: 1.5 # head down (dashboard, phone): lids close without sleep, so wait longer
    microsleep_unreliable_s: 1.0   # during a smile, laugh, yawn, lighting change or at the frame edge

  # Head nods (nodding off): a slow drift down, often with the eyes closing,
  # then a fast jerk back up. Pitch is relative to the calibrated neutral.
  nod:
    nod_start_deg: 6.0             # a drop starts this far below neutral
    nod_depth_deg: 12.0            # a nod goes at least this deep ...
    nod_wobble_multiple: 3.0       # ... and at least this x the driver's own calibrated pitch wobble
    nod_max_drop_speed_deg_s: 45.0 # drops slower than this are nod-like (a deliberate look down is faster) ...
    nod_recovery_speed_deg_s: 60.0 # ... and the head must come back up at least this fast (the jerk)
    nod_recovery_window_s: 2.5     # the jerk must come within this of the lowest point
    nod_max_drop_s: 4.0            # a drop still going after this long is a deliberate look down, not a nod
    nod_window_s: 120.0            # nods counted over this window for the score
    head_drop_lost_window_s: 0.6   # face lost within this of a downward movement = the head dropped
    head_drop_min_speed_deg_s: 8.0 # ... if it was going down at least this fast
    head_drop_microsleep_s: 0.5    # a head drop with the face lost this long counts as a microsleep
    # A face that vanishes just after moving down counts as a head drop (a
    # microsleep, straight to the top stage). Off at the booth: the camera
    # sits low on the driver's left, and their arm on the wheel passes in
    # front of it; the face is lost with a jump in the landmarks first, which
    # looked exactly like a drop (2026-11-06 log: four false stage-4 alarms).
    # Shut eyes and nods with the face in view still count. true: a camera
    # nothing can block, straight ahead of the driver.
    head_drop_when_lost: false

  perclos_window_s: 60.0
  openness_window_s: 45.0          # heavy lids: median openness of reliable, non-blink frames over this
  look_down_pitch_deg: 10.0        # head down past this (or 3x the calibrated pitch wobble) = looking down

  head:
    # Approximate on-road gaze cone. Outside it for longer than
    # off_road_alert_s counts as distraction.
    yaw_limit_deg: 25.0
    pitch_limit_deg: 20.0
    off_road_alert_s: 2.0          # NHTSA guideline: single glance > 2 s is risky
    nod_window_s: 10.0
    nod_pitch_std_deg: 6.0
    # Head poses where a longer glance is a normal driving task rather than
    # distraction. A 40 deg look toward the passenger mirror and a 40 deg look
    # at a phone are the same angle; only the region tells them apart, so a
    # named region buys extra dwell before the glance counts as off-road. A
    # region can only ever LENGTHEN the dwell, never shorten off_road_alert_s.
    #
    # Angles are CALIBRATION-RELATIVE: they are offsets from this driver's own
    # forward pose, not absolute camera angles, so they survive a change of
    # mount position. Sign convention, measured not assumed (solve_head_pose):
    #   yaw   < 0  driver turned toward their OWN LEFT
    #   yaw   > 0  driver turned toward their OWN RIGHT
    #   pitch > 0  looking DOWN
    #
    # THESE NUMBERS ARE PROVISIONAL. They are reasonable values for a
    # left-hand-drive cabin and nothing more. Measure them in the actual rig
    # with tools/measure_glance_zones.py and replace them before quoting any
    # false-positive rate.
    permitted_regions:
      - {name: rearview,     yaw: [-8.0,  22.0], pitch: [-25.0,  6.0], dwell_s: 3.0}
      - {name: left_mirror,  yaw: [-45.0, -10.0], pitch: [-18.0, 18.0], dwell_s: 3.0}
      - {name: right_mirror, yaw: [22.0,  62.0], pitch: [-18.0, 22.0], dwell_s: 3.0}
      # The instrument cluster overlaps the phone-in-lap pose, which is the
      # case this system exists to catch, so it is left OFF until measured.
      # - {name: cluster,    yaw: [-15.0, 10.0], pitch: [8.0, 26.0], dwell_s: 2.5}

calibration:
  # The guided calibration (docs/SPEC.md, 15). Look ahead, then close the eyes.
  duration_s: 15.0                 # look-ahead step ...
  max_duration_s: 25.0             # ... extended up to this until min_blinks are seen
  min_blinks: 3                    # blinks needed to learn this driver's normal blink
  min_tracking_fraction: 0.60      # the face must be tracked in at least this share of frames
  min_open_samples: 30             # absolute floor, for very slow streams
  max_relative_pose_deg: 12.0      # frames this far from the session's own median pose are dropped
  max_wobble_deg: 6.0              # head movement (robust std) above this: "Hold still", redo
                                   # (4 failed visitors at the booth who were only fidgeting)
  min_separation: 0.30             # (open - closed) / open EAR below this: eyes not separable, redo
  estimated_closed_ratio: 0.33     # no eyes-closed step: closed EAR estimated as this x open
  closed_lead_s: 0.7               # eyes-closed step: frames before this are the eyes still closing
  min_brightness: 25.0             # face darker than this (0-255): "Too dark". 45 failed
                                   # under the infrared light with the face still tracked well
  max_brightness: 235.0            # brighter: "Too bright"
  min_face_frac: 0.06              # eye distance / frame width below this: "Move closer"
  max_face_frac: 0.32              # above: "Move back"
  max_facing_deg: 50.0             # head turned further from the camera than this: "Face the camera".
                                   # The device sits to the driver's left, looking up: a driver
                                   # watching the road is 30-40 degrees off its axis, and that's fine
  max_attempts: 3                  # with an earlier calibration to fall back on, stop after this
                                   # many failed tries and keep it (no endless recalibrating)
  # Saved per driver: runs/drivers/<profile name>/calibration.json. This is
  # the fallback when there is no profile name.
  save_path: runs/calibration.json

state:
  # Weights for the fused drowsiness score (sum need not be 1; it is normalised).
  # Squint and PERCLOS carry most of it: both are eye-closure measures, the
  # best single predictors in the literature. The blink-shape signals catch
  # the early, gradual signs. See docs/thresholds.md.
  weights:
    heavy_lids: 0.20
    perclos: 0.20
    blink_duration: 0.14
    long_blinks: 0.14
    nods: 0.15
    lid_speed: 0.07
    microsleep: 0.05
    yawn: 0.03
    blink_rate: 0.02
  # Each signal maps linearly onto 0-1 between these two values (in its own
  # units), and is clamped outside them. Every lower anchor sits beyond the
  # driver's own normal variation, so an alert, calibrated driver scores ~0.
  ranges:
    heavy_lids: [0.15, 0.45]       # 1 - typical openness (personal scale); 15 % = normal variation
    perclos: [0.03, 0.15]          # P80 share of 60 s; alert < 5 %, drowsy > 15 % (Dinges & Grace 1998)
    blink_duration: [0.17, 0.30]   # s, recent median - the driver's normal + 0.12 (i.e. +0.05..+0.18 s)
    long_blinks: [1.0, 5.0]        # 0.3-0.5 s blinks per minute
    lid_speed: [1.3, 2.3]          # reopening amplitude-velocity ratio / the driver's normal
    nods: [0.0, 2.0]               # nods in the last 2 minutes
    microsleep: [0.0, 2.0]         # per minute
    yawn: [0.0, 18.0]              # per hour (3 in 10 minutes saturates)
    blink_rate: [1.5, 2.5]         # rate / the driver's normal
  # A detected nod lifts the score to at least this at once (level 2): rater
  # schemes put head nodding at "very drowsy" (Wierwille & Ellsworth 1994).
  nod_score: 0.50
  score_rise_tau_s: 6.0
  score_fall_tau_s: 20.0
  microsleep_score: 0.90
  # Four drowsiness stages after the KSS/PERCLOS stratification in the team
  # research doc: KSS 6 / 7 / 8 / 9 at PERCLOS 5 / 10 / 15 / 20 %. A level is
  # entered on EITHER the fused score or PERCLOS alone (min_perclos), with a
  # dwell to avoid flapping. Microsleeps (>= 0.5 s closure) jump straight to
  # the top level regardless.
  # Score thresholds on the smoothed 0-1 score (the app shows it x100).
  # Level 1 fires ladder stage 1 (blue light), and so on up. There is no
  # separate PERCLOS shortcut any more: on the true P80 scale ordinary
  # blinking already spends 3-5 % of the time below 20 % open, so a 5 % gate
  # flagged alert drivers, and PERCLOS is already in the score.
  levels:
    - {name: alert,     min_score: 0.00, dwell_s: 0.0}
    - {name: a_bit,     min_score: 0.25, dwell_s: 5.0}
    - {name: drowsy,    min_score: 0.45, dwell_s: 3.0}
    - {name: very,      min_score: 0.65, dwell_s: 2.0}
    - {name: extreme,   min_score: 0.82, dwell_s: 1.0}
  recovery_hysteresis: 0.08        # must drop this far below to de-escalate
  perclos_hysteresis: 0.02         # same, for the PERCLOS route
  no_face_grace_s: 1.5             # eyes-not-visible tolerated this long
  # MediaPipe loses the face past roughly 45-50 deg of yaw, so a blind-spot or
  # far-mirror check ENDS in a lost face. Judged by no_face_grace_s alone that
  # reported "driver not visible" after 1.5 s, which is shorter than an
  # ordinary shoulder check. If the head was already past turn_away_yaw_deg
  # when tracking dropped, the loss is scored as the tail of that glance and
  # gets lost_glance_grace_s instead.
  turn_away_yaw_deg: 35.0
  lost_glance_grace_s: 4.0
  # Iris offset (roughly -1..+1, 0 = centred) beyond which the eyes count as
  # off-road with the head still facing forward. Deliberately coarse; this is
  # not calibrated gaze. See docs/thresholds.md.
  gaze_off_road_threshold: 0.55

predictor:
  # Blend of (a) measured drowsiness trend and (b) a simplified two-process
  # alertness model (homeostatic + circadian, after Akerstedt & Folkard).
  enabled: true
  trend_window_s: 600.0            # 10 min of history for the slope fit
  min_history_s: 120.0
  unsafe_score: 0.55               # the "drowsy" level
  unsafe_exposure_fraction: 0.20   # >20% of the window spent unsafe forces "rest now"
  blend_measured_weight: 0.7
  measured_decay_tau_s: 1800.0      # measured slope hands over to the prior at ~30 min
  homeostatic_tau_h: 10.0          # decay constant of the wake process
  circadian_amplitude: 0.12
  circadian_peak_hour: 16.5        # alertness peak, local time
  # Rest recommendation
  min_rest_lead_time_s: 300.0      # do not bother suggesting a stop inside 5 min
  rest_interval_cap_s: 7200.0      # never recommend driving longer than 2 h

alerts:
  enabled: true
  # Graded escalation, one stage per drowsiness level. Each stage lists the
  # actuators fired on entry; an entry can carry per-stage overrides, e.g.
  # {scent: {duration_s: 20}}. The ladder is paced by cooldown_s: a gradual
  # slide climbs one stage per cooldown, a microsleep jumps to the top.
  #
  #   1 a bit drowsy  blue light, dim, held 30 min    (ipRGC / melatonin)
  #   2 drowsy        + mint burst                    (trigeminal TRPM8)
  #   3 very drowsy   slow 1 Hz chime + voice + mint  (conscious advisory)
  #   4 extreme       looming 3 Hz beeps + voice + long mint burst
  stages:
    - name: none
      actuators: []
    - name: light
      actuators: [blue_light]
      cooldown_s: 60.0
    - name: scent
      actuators: [blue_light, scent]
      cooldown_s: 90.0
    - name: chime
      actuators: [blue_light, warn, scent]
      cooldown_s: 45.0
    - name: emergency
      actuators: [blue_light, alarm, {scent: {duration_s: 20.0}}]
      cooldown_s: 20.0
  # A glance away gets its own short nudge and leaves the ladder alone.
  distraction:
    actuators: [chime]
    cooldown_s: 10.0
    face_lost_cooldown_s: 45.0   # "driver not visible" is often an empty seat
  # A face out of the camera's view sets off nothing at the booth (an arm on
  # the wheel, a look at the laptop's game read as "driver not visible" and
  # chimed up to stage 3, 2026-11-07). true: a real cab, where it matters.
  face_lost_alerts: false
  # Pi pin map. GPIO18-21 are I2S (INMP441 mic, two MAX98357A amps) and must
  # not be used here; GPIO2/3 are I2C (SCD41); GPIO25 is the IR illuminator.
  actuators:
    blue_light:
      type: light
      gpio_pin: 24
      hold_s: 1800.0             # 30 min; firing again restarts the clock
      # PWM duty. The target is ~1 lux at the eye from the periphery, and the
      # 3 W LED at full duty is far brighter; it also changes the NoIR
      # camera's exposure. Tune with the camera running.
      brightness: 0.2
    chime:
      # The piezo buzzer this replaces sat on GPIO18, now the I2S bit clock.
      type: audio
      file: assets/chime.wav
      refractory_s: 8.0
    warn:
      type: audio
      files: [assets/chime_slow.wav, "assets/voice/{lang}/stage3.wav"]
      refractory_s: 12.0
    alarm:
      type: audio
      files: [assets/looming.wav, "assets/voice/{lang}/stage4.wav"]
      refractory_s: 8.0
    scent:
      type: atomizer
      gpio_pin: 17
      # The research doc cites a 30 s burst; that figure comes from studies
      # with direct delivery, not an ultrasonic mister into a cabin. Start at
      # 10 s and test on a person before going longer.
      duration_s: 10.0
      refractory_s: 120.0       # peppermint habituates fast; do not spam it
      max_per_hour: 12
    # Spoken cues outside the ladder. Missing recordings are skipped.
    open_window:
      type: audio
      file: "assets/voice/{lang}/open_window.wav"
      refractory_s: 300.0
    rest_voice:
      type: audio
      file: "assets/voice/{lang}/rest_soon.wav"
      refractory_s: 900.0
    calibrate_voice:
      type: audio
      file: "assets/voice/{lang}/cal_look.wav"
    calibrated_voice:
      type: audio
      file: "assets/voice/{lang}/cal_done.wav"
    sleepy_voice:                # the "now try being sleepy" tip while driving
      type: audio
      file: "assets/voice/{lang}/try_sleepy.wav"

# Cabin CO2 (SCD41 on I2C). Fires the open_window prompt once per excursion.
air:
  enabled: true
  i2c_bus: 1
  prompt_ppm: 1500             # stale-cabin level
  drowsy_prompt_ppm: 1000      # lower bar once the driver is at drowsy_level
  drowsy_level: 2
  rearm_drop_ppm: 200
  actuator: open_window

# The Camera screen's video (only encoded while someone watches, on its own
# thread). 640 px is sharp on a phone held upright and light on Wi-Fi.
video:
  width: 640
  quality: 80                  # JPEG quality, 0-100
  max_fps: 30                  # at most this; the camera's own rate is the real limit

logging:
  dir: runs
  csv_hz: 10.0                 # per-frame features are downsampled to this
  log_events: true
  log_video: false             # true writes an annotated mp4 (costly on the Pi)

ui:
  show_window: true
  draw_mesh: true            # face outline and all 478 landmarks (one array write, under 1 ms)
  draw_eyes: true
  draw_gauges: true
  window_scale: 0.75
  # The preview window is redrawn at most this often. Drawing it every frame
  # slowed detection from ~34 to ~13 fps on a laptop; 15 still looks smooth.
  window_max_fps: 15
  # dashboard: the camera beside large panels of what the detector sees, for
  # presenting (the booth always uses it). overlay: the camera alone with a
  # small panel. l switches between them while running, f toggles full screen.
  layout: dashboard
  fullscreen: false
  dashboard_refresh_s: 0.2   # the panels are redrawn this often; the camera every frame
  # Nobody at the wheel this long: the visitor is forgotten (lights off, their
  # photos and drive wiped), the dashboard stays. The next face seen for 3 s
  # starts their guide: fit your face in the oval, calibration, then live hints
  # on the dashboard (no standby screen; the team helps at the booth). 0: never.
  standby_after_s: 30
  # The device speaker (the USB one in ~/.asoundrc): set to start_percent at
  # every start; the dashboard's VOL buttons and - / = change it from there.
  speaker_mixer: {card: UACDemoV10, control: PCM, start_percent: 80}
  # After a visitor has driven after_s seconds (face seen, on the dashboard),
  # a pop-up offers "learn more"; a click opens a screen with the QR code for
  # url and four wake-up stage cards that play on the real device (click or
  # keys 1-4). Back, Esc or qr_close_s untouched closes it. Once per visitor. url "": off.
  learn_more:
    url: https://seunghyun2007.github.io/bamnun/
    sleepy_tip_after_s: 20     # first, Ollie suggests trying to be sleepy (card + voice) ...
    sleepy_tip_hide_s: 15      # ... gone after this, or as soon as an alert answers it
    after_s: 60
    qr_after_s: 40             # the visitor's QR shows after this much driving, once their drive is uploaded
    hide_after_s: 40
    qr_close_s: 60

# Driver profile, settings and trip history, kept on the Pi (docs/SPEC.md,
# section 0). The phone caches a copy and pushes changes over the API.
storage:
  db: runs/bamnun.db

# A trip starts when a calibrated driver is first seen, or when the phone
# says so. An empty seat for break_min_s is a break (and resets the break
# reminder); for end_after_s it ends the trip.
trips:
  auto_start: true
  break_min_s: 180
  end_after_s: 900

# The Pi's own health (thermal.py). The temperature shows on the dashboard;
# at warm_c a warning bar appears on every screen, at hot_c (or when the
# firmware throttles) a red one. The Pi 5 throttles at 85 C. A weak power
# supply (under-voltage) also gets a red bar. It only warns.
thermal:
  warm_c: 75
  hot_c: 80
  every_s: 2           # temperature reads
  flags_every_s: 10    # vcgencmd get_throttled
