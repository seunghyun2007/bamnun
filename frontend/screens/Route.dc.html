<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a route</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}a{color:#F4EFE6}a:hover{color:#C4B5FD}input::placeholder{color:#7d6f7f}
.rt-map{position:relative;height:300px;border-radius:22px;overflow:hidden;background:#241A26;border:1px solid rgba(255,255,255,.09)}
.rt-msg{position:absolute;inset:0;display:grid;place-items:center;padding:20px;text-align:center;color:#B3A6B4;font-size:14px;line-height:1.45;z-index:2;background:#241A26}
.rt-row{display:flex;align-items:center;gap:12px;padding:11px 14px;color:#F4EFE6;text-decoration:none;width:100%;border:0;background:transparent;text-align:left;font:inherit;cursor:pointer}
.rt-row+.rt-row{border-top:1px solid rgba(255,255,255,.08)}
.rt-pin{position:relative;transform:translateY(-50%);padding:4px 8px;border-radius:99px;background:#F4EFE6;color:#241A26;font:700 12px Figtree,Arial,sans-serif;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.rt-pin.pick{background:#C4B5FD}
</style>
</helmet>
<div style="width:390px;min-height:844px;box-sizing:border-box;position:relative;background:radial-gradient(110% 55% at 50% 0%,rgba(168,132,232,0.38) 0%,rgba(168,132,232,0) 62%),radial-gradient(80% 45% at 0% 70%,rgba(244,164,128,0.24) 0%,rgba(244,164,128,0) 60%),radial-gradient(80% 45% at 100% 80%,rgba(236,140,172,0.23) 0%,rgba(236,140,172,0) 60%),#17111A;color:#F4EFE6;font-family:Figtree,Arial,sans-serif;display:flex;flex-direction:column;padding:56px 22px 0;padding:56px 16px 120px">
  <div style="display:flex;align-items:center;gap:14px;height:44px;margin-bottom:10px;padding:0 6px">
    <a href="Plan.dc.html" aria-label="Back" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);display:grid;place-items:center;color:#F4EFE6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <h1 style="margin:0;font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:800;font-stretch:80%;font-size:24px">Plan your route</h1>
  </div>
  <div class="rt-map"><div id="rMap" style="position:absolute;inset:0"></div><div id="rMapMsg" class="rt-msg">Loading the map…</div></div>
  <div style="position:relative;display:flex;flex-direction:column;gap:8px;margin-top:10px;padding:12px 12px 12px 40px;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)">
    <span aria-hidden="true" style="position:absolute;left:18px;top:28px;width:10px;height:10px;border-radius:50%;background:#F8C4A4"></span>
    <span aria-hidden="true" style="position:absolute;left:22px;top:42px;height:32px;border-left:2px dotted #7d6f7f"></span>
    <span aria-hidden="true" style="position:absolute;left:18px;bottom:28px;width:10px;height:10px;background:#F4EFE6"></span>
    <label for="rtFrom" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">From</label>
    <input id="rtFrom" autocomplete="off" placeholder="Starting point" style="padding:12px 14px;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.11);color:#F4EFE6;font:600 15px Figtree,Arial,sans-serif;outline:none;width:100%;box-sizing:border-box">
    <label for="rtTo" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Where to</label>
    <input id="rtTo" autocomplete="off" placeholder="Where to?" style="padding:12px 14px;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.11);color:#F4EFE6;font:600 15px Figtree,Arial,sans-serif;outline:none;width:100%;box-sizing:border-box;border-color:#C4B5FD">
  </div>
  <p id="rListHead" style="margin:16px 6px 8px;font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#B3A6B4"></p>
  <div id="rList" style="display:none;border-radius:20px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);overflow:hidden"></div>
  <div id="rSum"></div>
  <div style="position:fixed;left:0;right:0;bottom:0;padding:18px 22px 30px;display:flex;justify-content:center;background:linear-gradient(to top,rgba(23,17,26,.96) 50%,rgba(23,17,26,0));z-index:5">
    <button type="button" id="rSet" disabled style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:200px;padding:17px 30px;border:0;border-radius:999px;background:#F4EFE6;color:#241A26;font-weight:700;font-size:16px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:.4">Set route</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
