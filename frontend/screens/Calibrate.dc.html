<style>
body{margin:0}a{color:#F4EFE6}button{font:inherit;color:inherit;cursor:pointer}
.cb-card{position:absolute;inset:0;display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:24px;transition:transform .38s cubic-bezier(.22,1,.36,1),opacity .3s}
.cb-card.in{animation:cbIn .42s cubic-bezier(.22,1,.36,1) both}
.cb-card.out{transform:translateX(-110%);opacity:0}
@keyframes cbIn{from{transform:translateX(110%);opacity:0}to{transform:none;opacity:1}}
.cb-ring{transition:stroke-dasharray .35s linear}
.cb-check{position:absolute;inset:0;display:grid;place-items:center;opacity:0;transform:scale(.4);transition:all .35s cubic-bezier(.3,1.6,.5,1)}
.cb-card.ok .cb-check{opacity:1;transform:none}
.cb-card.ok .cb-ringwrap svg{opacity:.25}
.cb-hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);padding:7px 14px;border-radius:99px;background:#FFB547;color:#241A26;font-weight:800;font-size:14px;white-space:nowrap;opacity:0;transition:opacity .2s}
.cb-hint.on{opacity:1}
.cb-dots{display:flex;gap:6px;justify-content:center}
.cb-dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.18);transition:all .3s}
.cb-dots i.done{background:#C4B5FD}
.cb-dots i.now{background:#F4EFE6;width:20px;border-radius:9px}
.cb-ans{flex:1;padding:15px;border:0;border-radius:999px;font-weight:800;font-size:16px}
.cb-row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;font-size:14.5px}
.cb-row+.cb-row{border-top:1px solid rgba(255,255,255,.08)}
.cb-row span{color:#B3A6B4}
