<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ollie's style</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}a{color:#F4EFE6}a:hover{color:#C4B5FD}button{font:inherit;color:inherit;cursor:pointer}
.olw{position:relative;aspect-ratio:600/640}
.ol-shadow{position:absolute;left:24%;right:24%;bottom:2%;height:5%;border-radius:50%;background:rgba(0,0,0,.4);filter:blur(2px)}
.ol-loop{position:absolute;inset:0;transform-origin:50% 96%}
.ol-loop img{position:absolute;inset:0;width:100%;height:100%;display:block}
.ol-eye{position:absolute;width:18.6%;height:17.44%;border-radius:50%;overflow:hidden}
.ol-lid{position:absolute;left:-4%;right:-4%;top:-4%;height:108%;background:#714330;border-bottom:.22em solid #1b1320;border-radius:0 0 45% 45%/0 0 22% 22%;transform:translateY(-112%);animation:olBlink 5s cubic-bezier(.4,0,.2,1) infinite}
.a-breathe{animation:olBreathe 3.4s ease-in-out infinite}
.a-wave{animation:olWave 1.4s ease-in-out infinite}
.a-jump{animation:olJump 1.1s cubic-bezier(.45,0,.55,1) infinite}
.a-drive{animation:olDrive 3.2s ease-in-out infinite}
.s-jump{animation:olShadow 1.1s cubic-bezier(.45,0,.55,1) infinite}
.vc-say{animation:vcSay .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes olBlink{0%,90%,100%{transform:translateY(-112%)}93%,94.5%{transform:translateY(0)}}
@keyframes olBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(.985,1.03)}}
@keyframes olWave{0%,100%{transform:rotate(-3deg) scale(1,1)}30%{transform:rotate(2.5deg) scale(1.02,.98)}55%{transform:rotate(3.5deg) scale(.99,1.01)}80%{transform:rotate(-1deg) scale(1.01,.99)}}
@keyframes olJump{0%{transform:translateY(0) scale(1.08,.9)}22%{transform:translateY(-15%) scale(.93,1.09)}42%{transform:translateY(-22%) scale(1,1)}62%{transform:translateY(-4%) scale(.96,1.05)}72%{transform:translateY(0) scale(1.1,.88)}84%{transform:translateY(0) scale(.97,1.03)}100%{transform:translateY(0) scale(1.08,.9)}}
@keyframes olShadow{0%,72%,100%{transform:scale(1);opacity:1}42%{transform:scale(.55);opacity:.45}}
@keyframes olDrive{0%,100%{transform:translateY(0) rotate(0)}10%{transform:translateY(-.8%)}20%{transform:translateY(0)}30%{transform:translateY(-.6%)}40%{transform:translateY(0) rotate(0)}55%{transform:rotate(-2deg)}70%{transform:rotate(1.5deg)}85%{transform:rotate(0)}}
@keyframes vcSay{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;position:relative;overflow:hidden;background:radial-gradient(120% 55% at 0% 0%,rgba(168,132,232,0.41) 0%,rgba(168,132,232,0) 62%),radial-gradient(90% 50% at 100% 12%,rgba(236,140,172,0.30) 0%,rgba(236,140,172,0) 60%),radial-gradient(110% 60% at 40% 105%,rgba(244,164,128,0.27) 0%,rgba(244,164,128,0) 65%),#17111A;color:#F4EFE6;font-family:Figtree,Arial,sans-serif;display:flex;flex-direction:column;padding:56px 22px 0">
  <div style="display:flex;align-items:center;gap:14px;height:44px;margin-bottom:14px">
    <a href="Night.dc.html" aria-label="Back" style="width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);display:grid;place-items:center;color:#F4EFE6"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
    <div style="flex-grow:1;height:8px;border-radius:9px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);overflow:hidden"><div style="width:45%;height:100%;border-radius:9px;background:linear-gradient(90deg,#C4B5FD,#F9A8D4)"></div></div>
  </div>
  <h1 style="margin:6px 0 0;font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:800;font-stretch:75%;font-size:36px;line-height:1.02;text-align:center">How should Ollie talk to you?</h1>
  <div style="display:flex;gap:10px;align-items:flex-start;margin-top:16px">
    <div style="position:relative;width:52px;height:52px;flex-shrink:0;border-radius:50%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);overflow:hidden"><img src="{{cur.src}}" alt="" style="position:absolute;width:80px;left:-14px;top:-4px"></div>
    <p class="vc-say" style="margin:0;background:#F4EFE6;color:#241A26;border-radius:20px 20px 20px 6px;padding:14px 16px;font-family:'Bricolage Grotesque',Arial,sans-serif;font-weight:700;font-stretch:85%;font-size:20px;line-height:1.15">{{cur.line}}</p>
  </div>
  <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:18px">
    <sc-for list="{{cards}}" as="c" hint-placeholder-count="4">
      <button aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">
        <sc-if value="{{c.selected}}" hint-placeholder-val="{{false}}"><span style="position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:#C4B5FD;display:grid;place-items:center"><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="#241A26" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"></path></svg></span></sc-if>
        <div class="olw" style="width:96px;font-size:9.6px">
          <div class="{{c.shadowCls}}"></div>
          <div class="ol-loop {{c.anim}}">
            <img src="{{c.src}}" alt="">
            <sc-for list="{{c.eyes}}" as="e" hint-placeholder-count="2"><div class="ol-eye" style="{{e.style}}"><div class="ol-lid"></div></div></sc-for>
          </div>
        </div>
        <b style="font-size:15px">{{c.name}}</b><small style="color:#B3A6B4;font-size:12.5px;text-align:center">{{c.desc}}</small>
      </button>
    </sc-for>
  </div>
  <div style="position:absolute;left:0;right:0;bottom:0;padding:24px 22px 40px;display:flex;justify-content:center">
    <a href="Ladder.dc.html" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-width:150px;padding:17px 30px;box-sizing:border-box;border-radius:999px;background:#F4EFE6;color:#241A26;font-weight:700;font-size:16px;text-decoration:none;box-shadow:0 10px 30px rgba(0,0,0,.5)">Next <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg></a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 2 }; }
  renderVals() {
    const eye = (l, t) => ({ style: 'left:' + l + '%;top:' + t + '%' });
    const C = [
      { name: 'Calm guide', desc: 'Soft voice, gentle nudges', line: 'Easy now. There’s a rest stop in 12 km.', src: '/_blob/bb73e1b39dabf3b35d036c39c5cdd1c1', anim: 'a-breathe', eyes: [eye(27.08, 32.58), eye(54.2, 32.6)] },
      { name: 'Straight talker', desc: 'Short and direct', line: 'Your eyes are closing. Pull over.', src: '/_blob/e5ad4d3fd744c75caea7c6c78782a441', anim: 'a-drive', eyes: [eye(27.65, 38.91), eye(53.35, 38.71)] },
      { name: 'Cheerleader', desc: 'Upbeat, keeps you going', line: 'You’ve got this! Coffee break in 10?', src: '/_blob/f6f6ffbf7935cbf40e40727534b41f50', anim: 'a-jump', eyes: [], jump: true },
      { name: 'Road buddy', desc: 'Chatty, like a co-driver', line: 'Long night, huh? Let’s stretch at the next stop.', src: '/_blob/be4e6418a0a3f416c7aca695e46d9667', anim: 'a-wave', eyes: [] }
    ];
    const p = this.state.pick;
    const cards = C.map((c, i) => ({
      name: c.name, desc: c.desc, src: c.src, anim: c.anim, eyes: c.eyes,
      shadowCls: c.jump ? 'ol-shadow s-jump' : 'ol-shadow',
      selected: i === p, on: String(i === p),
      style: 'position:relative;border-radius:22px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;border:2px solid ' + (i === p ? '#C4B5FD' : 'transparent') + ';background:' + (i === p ? 'rgba(196,181,253,.16)' : 'rgba(255,255,255,.07)'),
      pick: () => this.setState({ pick: i })
    }));
    return { cards, cur: C[p] };
  }
}
</script>
</body>
</html>
