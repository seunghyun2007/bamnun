<style>
body{margin:0}a{color:#F2EEE8}a:hover{color:#E8D7AE}button{font:inherit;color:inherit;cursor:pointer}
.olw{position:relative;aspect-ratio:600/640}
.ol-shadow{position:absolute;left:24%;right:24%;bottom:2%;height:5%;border-radius:50%;background:rgba(0,0,0,.4);filter:blur(2px)}
.ol-loop{position:absolute;inset:0;transform-origin:50% 96%}
.ol-loop img{position:absolute;inset:0;width:100%;height:100%;display:block}
.ol-eye{position:absolute;width:18.6%;height:17.44%;border-radius:50%;overflow:hidden}

.a-drive{animation:olDrive 3.2s ease-in-out infinite}
.s-jump{animation:olShadow 1.1s cubic-bezier(.45,0,.55,1) infinite}
.vc-say{animation:vcSay .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes olBlink{0%,90%,100%{transform:translateY(-112%)}93%,94.5%{transform:translateY(0)}}

@keyframes olDrive{0%,100%{transform:translateY(0) rotate(0)}10%{transform:translateY(-.8%)}20%{transform:translateY(0)}30%{transform:translateY(-.6%)}40%{transform:translateY(0) rotate(0)}55%{transform:rotate(-2deg)}70%{transform:rotate(1.5deg)}85%{transform:rotate(0)}}
@keyframes vcSay{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:none}}

.cal-ring{transition:stroke-dasharray .4s linear}
.cal-row{display:flex;align-items:center;gap:12px;padding:10px 14px;font-size:15px;font-weight:600;color:#9A93A0;transition:color .2s}
.cal-row+.cal-row{border-top:1px solid rgba(255,255,255,.07)}
.cal-dot{width:24px;height:24px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.11);font-size:13px;font-weight:700;color:#15131A}
@keyframes calPulse{0%,100%{box-shadow:0 0 0 0 rgba(232,215,174,.5)}50%{box-shadow:0 0 0 6px rgba(232,215,174,0)}}
.cal-now .cal-dot{background:#E8D7AE;animation:calPulse 1.4s ease-in-out infinite}
.ol-clip{position:absolute;inset:0}
.ol-enter{position:absolute;inset:0;transform-origin:50% 96%;animation:olIn .8s cubic-bezier(.22,1,.36,1) both}
@keyframes olIn{0%{opacity:0;transform:translateY(14%) scale(.5,.42)}38%{opacity:1;transform:translateY(-5%) scale(1.07,.95)}58%{transform:translateY(0) scale(.95,1.05)}78%{transform:scale(1.02,.98)}100%{opacity:1;transform:none}}
