#s-Home .ol-eye{position:absolute;width:18.6%;height:17.44%;border-radius:50%;overflow:hidden}
#s-Home .ol-lid{position:absolute;left:-4%;right:-4%;top:-4%;height:108%;background:#714330;border-bottom:.22em solid #1b1320;border-radius:0 0 45% 45%/0 0 22% 22%;transform:translateY(-112%);animation:olBlink 5s cubic-bezier(.4,0,.2,1) infinite}
#s-Home .a-breathe{animation:olBreathe 3.4s ease-in-out infinite}
#s-Home .hm-say{animation:hmSay .5s .9s cubic-bezier(.3,1.6,.5,1) both;transform-origin:100% 100%}
@keyframes olIn{0%{opacity:0;transform:translateY(14%) scale(.5,.42)}38%{opacity:1;transform:translateY(-5%) scale(1.07,.95)}58%{transform:translateY(0) scale(.95,1.05)}78%{transform:scale(1.02,.98)}100%{opacity:1;transform:none}}
@keyframes olBlink{0%,90%,100%{transform:translateY(-112%)}93%,94.5%{transform:translateY(0)}}
@keyframes olBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(.985,1.03)}}
@keyframes hmSay{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
#s-Home .pt-field{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
#s-Home .pt{position:absolute;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 8px 2px rgba(196,181,253,.55);animation:ptFloat linear infinite}
@keyframes ptFloat{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:.9}80%{opacity:.5}100%{opacity:0;transform:translate(var(--dx),-170px) scale(1)}}
/* Camera */
#s-Camera{margin:0}
#s-Camera a{color:#F4EFE6}
#s-Camera a:hover{color:#C4B5FD}
#s-Camera .cm-scan{animation:cmScan 2.4s linear infinite}
#s-Camera .cm-dot{animation:cmDot 1.2s ease-in-out infinite}
@keyframes cmScan{from{transform:translateY(-60px)}to{transform:translateY(420px)}}
@keyframes cmDot{0%,100%{opacity:1}50%{opacity:.3}}
/* Trips */
#s-Trips{margin:0}
#s-Trips a{color:#F4EFE6}
#s-Trips a:hover{color:#C4B5FD}
#s-Trips button{font:inherit;color:inherit;cursor:pointer}
/* Insights */
#s-Insights{margin:0}
#s-Insights a{color:#F4EFE6}
#s-Insights a:hover{color:#C4B5FD}
#s-Insights button{font:inherit;color:inherit;cursor:pointer}
/* Settings */
#s-Settings{margin:0}
#s-Settings a{color:#F4EFE6}
#s-Settings a:hover{color:#C4B5FD}
#s-Settings button{font:inherit;color:inherit;cursor:pointer}
</style>

/* Vanilla versions of the three interactive canvas screens. Each init gets the screen's root element. */
const DYN = {
  Night(root) {
    const names = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
    const days = [true, true, true, true, true, false, false];
    const P = {
      day: { label: 'Day', range: '6 AM–2 PM', a: 6, b: 14, start: '6:00 AM', end: '2:00 PM', hard: 'Your hardest stretch is right after lunch, around 1 to 2 PM.' },
      eve: { label: 'Evening', range: '2–10 PM', a: 14, b: 22, start: '2:00 PM', end: '10:00 PM', hard: 'Your hardest stretch is the start, around 2 to 3 PM.' },
      night: { label: 'Night', range: '10 PM–6 AM', a: 22, b: 6, start: '10:00 PM', end: '6:00 AM', hard: 'Your hardest stretch is 3 to 5 AM. Ollie will plan a break before it.' },
      custom: { label: 'Custom', range: 'Set times', a: 20, b: 4, start: '8:00 PM', end: '4:00 AM', hard: 'Your hardest stretch is 2 to 4 AM. Ollie will plan a break before it.' }
    };
    let shift = 'night';
    const $ = (s) => root.querySelector(s);
    function draw() {
      $('#nDays').innerHTML = names.map((n, i) => `<button type="button" data-d="${i}" aria-pressed="${days[i]}" aria-label="${n}" style="width:42px;height:42px;border-radius:50%;border:2px solid ${days[i] ? '#C4B5FD' : 'transparent'};background:${days[i] ? '#C4B5FD' : 'rgba(255,255,255,.07)'};color:${days[i] ? '#241A26' : '#B3A6B4'};font-weight:700;font-size:15px;padding:0;transition:all .2s">${n[0]}</button>`).join('');
      $('#nPresets').innerHTML = Object.keys(P).map((k) => `<button type="button" data-p="${k}" aria-pressed="${shift === k}" style="padding:10px 4px;border-radius:14px;text-align:center;border:2px solid ${shift === k ? '#C4B5FD' : 'transparent'};background:${shift === k ? 'rgba(196,181,253,.16)' : 'rgba(255,255,255,.07)'};transition:all .2s"><b style="display:block;font-size:14px">${P[k].label}</b><span style="display:block;font-size:11px;color:#B3A6B4;margin-top:2px;white-space:nowrap">${P[k].range}</span></button>`).join('');
      const c = P[shift];
      $('#nStart').textContent = c.start; $('#nEnd').textContent = c.end; $('#nHard').textContent = c.hard;
      const seg = (a, b) => `<div style="position:absolute;top:5px;bottom:5px;border-radius:5px;background:#C4B5FD;left:${a / 24 * 100}%;width:${(b - a) / 24 * 100}%;transition:all .4s"></div>`;
      $('#nSegs').innerHTML = c.a < c.b ? seg(c.a, c.b) : seg(c.a, 24) + seg(0, c.b);
    }
    root.addEventListener('click', (e) => {
      const d = e.target.closest('[data-d]'); if (d) { days[+d.dataset.d] = !days[+d.dataset.d]; draw(); }
      const p = e.target.closest('[data-p]'); if (p) { shift = p.dataset.p; draw(); }
    });
    draw();
  },
  Ladder(root) {
    root.querySelectorAll('[data-tog]').forEach((b) => {
      const paint = () => { const on = b.getAttribute('aria-checked') === 'true'; b.style.background = on ? '#C4B5FD' : 'rgba(255,255,255,.11)'; b.firstElementChild.style.transform = 'translateX(' + (on ? 20 : 0) + 'px)'; };
      b.addEventListener('click', () => { b.setAttribute('aria-checked', String(b.getAttribute('aria-checked') !== 'true')); paint(); });
      paint();
    });
  },
  Voice(root) {
    const eye = (l, t) => `<div class="ol-eye" style="left:${l}%;top:${t}%"><div class="ol-lid"></div></div>`;
    const C = [
      { name: 'Calm guide', desc: 'Soft voice, gentle nudges', line: 'Easy now. There’s a rest stop in 12 km.', src: IMG.idle, anim: 'a-breathe', eyes: eye(27.08, 32.58) + eye(54.2, 32.6) },

": "가장 힘든 시간은 새벽 2~4시예요. 올리가 그 전에 휴식을 잡아둘게요.", "Calm guide": "차분한 안내자", "Soft voice, gentle nudges": "부드러운 목소리, 살짝 깨우기", "Easy now. There’s a rest stop in 12 km.": "천천히요. 12km 앞에 휴게소가 있어요.", "Straight talker": "직설파", "Short and direct": "짧고 분명하게", "Your eyes are closing. Pull over.": "눈이 감기고 있어요. 차를 세우세요.", "Soft voice, gentle nudges ": "부드러운 목소리, 살짝 깨우기", "Upbeat, keeps you going": "밝은 에너지로 힘을 줘요", "You’ve got this! Coffee break in 10?": "잘하고 있어요! 10분 뒤 커피 한잔?", "Road buddy": "길동무", "Chatty, like a co-driver": "옆자리 동료처럼 수다스럽게", "Long night, huh? Let’s stretch at the next stop.": "긴 밤이죠? 다음 휴게소에서 스트레칭해요.", "Monday": "월요일", "Tuesday": "화요일", "Wednesday": "수요일", "Thursday": "목요일", "Friday": "금요일", "Saturday": "토요일", "Sunday": "일요일", "Ollie": "올리", "Ollie the owl": "부엉이 올리", "Ollie the owl waving hello": "손 흔드는 부엉이 올리", "Ollie the owl peeking up": "빼꼼 보는 부엉이 올리", "Ollie the owl thinking": "생각하는 부엉이 올리", "Ollie the owl celebrating": "축하하는 부엉이 올리", "e.g. Minsu": "예: 민수", "Current location · Incheon": "현재 위치 · 인천", "Where to?": "어디로 가세요?", "Busan": "부산", "Open live camera": "실시간 카메라 열기", "Bamnun device": "밤눈 기기", "Strong signal": "신호 강함", "0.5 s": "0.5초", "0.18 s": "0.18초"}, "html": {"Eyes on the road.Ollie watches yours.": "도로는 당신이,<br><span style=\"color:#C4B5FD\">올리</span>는 당신의 눈을.", "Already have an account? Sign in": "이미 계정이 있나요? <b style=\"color:#F4EFE6\">로그인</b>", "Bamnun flags a microsleep while your eyes are still shut, not after you wake up.": "<strong style=\"color:#F4EFE6\">밤눈은 눈이 감겨 있는 그 순간 미세수면을 잡아내요,</strong> 깨어난 뒤가 아니라요.", "Ollie treats your eyes as closed at 65% of your own open level, so naturally narrow eyes are never mistaken for sleep.": "올리는 <b style=\"color:#F4EFE6\">내가 눈 뜬 정도의 65%</b> 아래를 감은 것으로 봐요. 원래 눈이 작아도 잠든 걸로 오해하지 않아요.", "Ollie is connected and knows your eyes. Your hardest stretch on a night shift is 3 to 5 AM.": "올리가 연결되었고 당신의 눈도 익혔어요. 야간 근무에서 가장 힘든 시간은 <b style=\"color:#F4EFE6\">새벽 3~5시</b>예요.", "Going somewhere tonight?Add a route and Ollie plans rest stops before your tired window.": "<b style=\"display:block;color:#F4EFE6;font-size:15.5px\">오늘 밤 어디 가세요?</b>경로를 추가하면 올리가 피로 시간대 전에 휴게소를 잡아줘요.", "Good evening,Siroj": "좋은 저녁이에요,<br>Siroj", "Hardest stretch tonight is 3 to 5 AM. Start a trip and Ollie starts watching.": "오늘 밤 가장 힘든 시간은 <b style=\"color:#F4EFE6\">새벽 3~5시</b>예요. 운행을 시작하면 올리가 지켜볼게요.", "Longest alert-free stretch 1 h 32 m": "알림 없이 달린 최장 구간 <b style=\"color:#F4EFE6\">1시간 32분</b>"}};
const DAYS=["M","T","W","T","F","S","S"],KDAYS=["월","화","수","목","금","토","일"];
let LANG="en";try{LANG=localStorage.getItem("bn-lang")||"en"}catch(e){}
window.BN_LANG=()=>LANG;
const phone=document.getElementById("phone");
let cur=null,ret=null;
const norm=t=>t.replace(/\s+/g," ").trim();
function translate(node){
  if(LANG!=="ko"||!node)return;
  const els=node.nodeType===1?[node,...node.querySelectorAll("*")]:[];
  const done=new Set();
  for(const el of els){
    if([...done].some(d=>d.contains(el)))continue;
    // whole-element (mixed inline) translations
    if(el.children.length&&!el.querySelector("div,section,svg,img,button,a,p,h1,h2,input")){
      const k=norm(el.textContent);if(KO.html[k]){el.innerHTML=KO.html[k];done.add(el);continue;}
    }
    // day-letter rows
    const kids=[...el.children];
    if(kids.length===7&&kids.every((c,i)=>norm(c.textContent)===DAYS[i]))kids.forEach((c,i)=>{const w=document.createTreeWalker(c,4);let t;while(t=w.nextNode())if(norm(t.data))t.data=KDAYS[i];});
    for(const at of ["placeholder","aria-label","alt"]){const v=el.getAttribute&&el.getAttribute(at);if(v&&KO.text[norm(v)])el.setAttribute(at,KO.text[norm(v)]);}
  }
  const w=document.createTreeWalker(node,4);let t;const list=[];while(t=w.nextNode())list.push(t);
  for(const t of list){if(t.parentElement&&t.parentElement.closest("[data-lang]"))continue;const k=norm(t.data);if(k&&KO.text[k])t.data=t.data.replace(/\S[\s\S]*\S|\S/,KO.text[k]);}
  for(const inp of node.querySelectorAll?node.querySelectorAll("input"):[]){const k=norm(inp.value||"");if(KO.text[k])inp.value=KO.text[k];}
}
new MutationObserver(ms=>{if(LANG!=="ko")return;for(const m of ms)for(const n of m.addedNodes){if(n.nodeType===1)translate(n);else if(n.nodeType===3&&n.parentElement)translate(n.parentElement);}}).observe(phone,{childList:true,subtree:true});
function setLang(l){LANG=l;try{localStorage.setItem("bn-lang",l)}catch(e){}phone.classList.toggle("ko",l==="ko");document.documentElement.lang=l;}
setLang(LANG);
function fit(){
  const w=innerWidth,h=innerHeight;
  if(w<=500){ const s=w/390; phone.classList.add("full"); phone.style.height=(h/s)+"px"; phone.style.transform=`scale(${s})`; }
  else { phone.classList.remove("full"); phone.style.height="844px"; const s=Math.min(1.15,(h-48)/844,(w-48)/390); phone.style.transform=`translate(-50%,-50%) scale(${s})`; }
}
addEventListener("resize",fit); fit();
function go(name,opts={}){
  if(!document.getElementById("t-"+name)) return;
  const back = opts.back || (cur && ORDER.indexOf(name) < ORDER.indexOf(cur));
  const old=phone.querySelector(".screen:not(.leave)");
  if(old){ old.classList.add("leave"); setTimeout(()=>old.remove(),300); }
  const sc=document.createElement("div"); sc.className="screen "+(opts.instant?"":(back?"back":"enter"));
  const root=document.createElement("div"); root.id="s-"+name;
  root.appendChild(document.getElementById("t-"+name).content.cloneNode(true));
  translate(root);
  sc.appendChild(root); phone.appendChild(sc);
  if(opts.keepScroll&&old)sc.scrollTop=old.scrollTop;
  cur=name;
  try{ history.replaceState(null,"","#"+name); }catch(e){}
  if(DYN[name]) DYN[name](root,{go,setLang,rerender:()=>go(name,{instant:true,keepScroll:true})});
  if(name==="Plan") setTimeout(()=>SFX.play("success"),350);
}
window.BN_GO=go;
phone.addEventListener("click",e=>{
  SFX.unlock();
  const owl=e.target.closest(".olw");
  if(owl&&!e.target.closest("a,button")){owl.classList.remove("poke");void owl.offsetWidth;owl.classList.add("poke");SFX.play("hoot");return;}
  const lang=e.target.closest("[data-lang]");
  if(lang){ const changed=lang.dataset.lang!==LANG; setLang(lang.dataset.lang); SFX.play("select"); if(!lang.dataset.go){ if(changed) go(cur,{instant:true,keepScroll:true}); return; } }
  const a=e.target.closest("[data-go]");
  if(a){
    e.preventDefault();
    const isBack=a.getAttribute("aria-label")==="Back"||a.dataset.back!==undefined;
    let to=a.dataset.go;
    if(isBack&&ret&&cur!==ret){to=ret;ret=null;}
    else if(cur==="Settings"&&!isBack)ret="Settings";
    else if(!isBack)ret=null;
    if(!lang)SFX.play(a.getAttribute("aria-label")==="Start trip"?"start":(isBack||ORDER.indexOf(to)<ORDER.indexOf(cur)?"back":"nav"));
    go(to,{back:isBack});
    return;
  }
  const b=e.target.closest("button");
  if(b){ if(b.getAttribute("role")==="switch")setTimeout(()=>SFX.play(b.getAttribute("aria-checked")==="true"?"on":"off"),0);
         else if(b.hasAttribute("aria-pressed")||b.dataset.p||b.dataset.d||b.dataset.c)SFX.play("select"); else SFX.play("tap"); }
});
phone.addEventListener("submit",e=>e.preventDefault());
const start=(location.hash||"").slice(1);
go(ORDER.includes(start)?start:"Main",{instant:true});
})();
</script>
