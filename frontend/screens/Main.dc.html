<style>
body{margin:0}a{color:#F2EEE8}a:hover{color:#E8D7AE}
.olw{position:relative;aspect-ratio:600/640}

.ol-loop{position:absolute;inset:0;transform-origin:50% 96%}
.ol-loop img{position:absolute;inset:0;width:100%;height:100%;display:block;filter:drop-shadow(0 .4em .8em rgba(0,0,0,.35))}
.ol-eye{position:absolute;width:18.6%;height:17.44%;border-radius:50%;overflow:hidden}

.sp-word{animation:spUp .7s .35s cubic-bezier(.22,1,.36,1) both}
@keyframes olIn{0%{opacity:0;transform:translateY(14%) scale(.5,.42)}38%{opacity:1;transform:translateY(-5%) scale(1.07,.95)}58%{transform:translateY(0) scale(.95,1.05)}78%{transform:scale(1.02,.98)}100%{opacity:1;transform:none}}
@keyframes olBlink{0%,90%,100%{transform:translateY(-112%)}93%,94.5%{transform:translateY(0)}}
@keyframes olBreathe{0%,100%{transform:scale(1,1)}50%{transform:scale(.985,1.03)}}
.sp-lang{animation:spUp .7s .9s cubic-bezier(.22,1,.36,1) both}
@keyframes spUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.pt-field{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.pt{position:absolute;border-radius:50%;background:#fff;opacity:0;animation:ptFloat linear infinite}
@keyframes ptFloat{0%{opacity:0;transform:translate(0,0) scale(.6)}15%{opacity:.9}80%{opacity:.5}100%{opacity:0;transform:translate(var(--dx),-170px) scale(1)}}
