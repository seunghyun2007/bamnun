<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plan your route</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}button{font:inherit;color:inherit;cursor:pointer}input::placeholder{color:#9A93A0}
.mp-page{position:absolute;inset:0;overflow:hidden;background:#15131A;color:#F2EEE8;font-family:Pretendard,Arial,sans-serif}
.mp-map{position:absolute;inset:0}
.mp-msg{position:absolute;inset:0;display:grid;place-items:center;padding:30px;text-align:center;color:#9A93A0;font-size:14.5px;line-height:1.45;z-index:3;background:#15131A}
.mp-glass{background:rgba(31,28,36,.92);border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 34px rgba(0,0,0,.45)}
.mp-top{position:absolute;left:10px;right:10px;top:14px;z-index:4;border-radius:22px;padding:10px}
.mp-back{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#F2EEE8;flex-shrink:0;text-decoration:none}
.mp-in{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.1);color:#F2EEE8;font:600 15px Pretendard,Arial,sans-serif;outline:none}
.mp-in:focus{border-color:#E8D7AE}
.mp-pinbtn{width:40px;height:40px;flex-shrink:0;border-radius:12px;border:0;background:rgba(255,255,255,.1);display:grid;place-items:center;color:#E8D7AE}
.mp-pinbtn[aria-pressed=true]{background:#E8D7AE;color:#15131A}
.mp-list{position:absolute;left:10px;right:10px;z-index:4;border-radius:18px;overflow:hidden;max-height:330px;overflow-y:auto}
.mp-row{display:flex;align-items:center;gap:12px;padding:11px 14px;width:100%;border:0;background:transparent;text-align:left;color:#F2EEE8}
.mp-row+.mp-row{border-top:1px solid rgba(255,255,255,.08)}
.mp-sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;border-radius:26px 26px 0 0;padding:10px 16px 26px;max-height:62%;overflow-y:auto}
.mp-grab{width:40px;height:5px;border-radius:9px;background:rgba(255,255,255,.22);margin:0 auto 10px}
.mp-cta{width:100%;padding:16px;border:0;border-radius:999px;background:#F2EEE8;color:#15131A;font-weight:700;font-size:16px}
.mp-cta[disabled]{opacity:.4}
.mp-fab{position:absolute;right:12px;z-index:4;width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;color:#F2EEE8}
.mp-cross{position:absolute;left:50%;top:50%;z-index:3;width:44px;height:58px;margin:-58px 0 0 -22px;pointer-events:none;display:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.45));transition:transform .15s}
.mp-cross.lift{transform:translateY(-10px)}
.mp-cross::after{content:"";position:absolute;left:50%;bottom:-4px;width:10px;height:4px;margin-left:-5px;border-radius:50%;background:rgba(0,0,0,.45)}
.mp-pin{transform:translateY(-50%);padding:4px 9px;border-radius:99px;background:#F2EEE8;color:#15131A;font:700 12px Pretendard,Arial,sans-serif;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.mp-pin.pick{background:#E8D7AE}
.mp-me{width:18px;height:18px;border-radius:50%;background:#4C8DFF;border:3px solid #fff;box-shadow:0 0 0 7px rgba(76,141,255,.25)}
.mp-row b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</helmet>
<div class="mp-page" id="rPage">
  <div class="mp-map" id="rMap"></div>
  <div class="mp-msg" id="rMapMsg">Loading the map…</div>
  <svg class="mp-cross" id="rCross" viewBox="0 0 44 58" aria-hidden="true"><path d="M22 56C22 56 4 34 4 21a18 18 0 0 1 36 0c0 13-18 35-18 35z" fill="#E8D7AE" stroke="#15131A" stroke-width="2.5"></path><circle cx="22" cy="21" r="7" fill="#15131A"></circle></svg>
  <div class="mp-top mp-glass" id="rTop">
    <div style="display:flex;gap:8px;align-items:center">
      <a href="Home.dc.html" aria-label="Back" class="mp-back"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
      <div style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:0">
        <div style="display:flex;gap:6px;align-items:center"><span aria-hidden="true" style="width:10px;height:10px;border-radius:50%;background:#E8D7AE;flex-shrink:0"></span><label for="rtFrom" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">From</label><input id="rtFrom" class="mp-in" autocomplete="off" placeholder="Starting point"><button type="button" class="mp-pinbtn" data-pickon="from" aria-pressed="false" aria-label="Pick the start on the map"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></button></div>
        <div style="display:flex;gap:6px;align-items:center"><span aria-hidden="true" style="width:10px;height:10px;background:#E8D7AE;flex-shrink:0"></span><label for="rtTo" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Where to</label><input id="rtTo" class="mp-in" autocomplete="off" placeholder="Where to?"><button type="button" class="mp-pinbtn" data-pickon="to" aria-pressed="false" aria-label="Pick the destination on the map"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"></path><circle cx="12" cy="9.5" r="2.5"></circle></svg></button></div>
      </div>
    </div>
  </div>
  <div class="mp-list mp-glass" id="rList" hidden></div>
  <button type="button" class="mp-fab mp-glass" id="rLocate" aria-label="My location" style="bottom:250px"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg></button>
  <div class="mp-sheet mp-glass" id="rSheet"><div class="mp-grab"></div><div id="rSum"></div></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>

  renderVals() { return {}; }
}
</script>
</body>
</html>
